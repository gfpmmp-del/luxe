name: luxe
description: Luxe Messenger — мессенджер с чатами, файлами и звонками WebRTC.
publish_to: 'none'
version: 1.1.0+2

environment:
  # Не поднимать выше 3.12: на Codemagic стоит Dart 3.12.2, и при более
  # высоком требовании `flutter pub get` там падает с «version solving
  # failed», а iOS-сборка не запускается вовсе.
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.5.6
  flutter_webrtc: ^1.6.2
  image_picker: ^1.0.7
  file_picker: ^8.0.0+1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  # audio_session удалён: flutter_webrtc управляет звуком сам, а внешний
  # пакет перебивал его настройки — пропадал звук и не работал динамик.
  url_launcher: ^6.2.0
  uuid: ^4.4.0
  timeago: ^3.6.1
  google_fonts: ^6.2.1
  path_provider: ^2.1.6
  http: ^1.6.0
  record: ^7.1.2
  just_audio: ^0.10.6
  lottie: ^3.6.1
  video_player: ^2.14.1

# Firebase отключён на Windows: FCM там не поддерживается, а нативный SDK
# firebase_core для Windows весит ~4 ГБ. Локальная копия без windows/.
dependency_overrides:
  firebase_core:
    path: third_party/firebase_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/luxe_logo.png
