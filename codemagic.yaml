name: luxe_ios
type: flutter

workflows:
  # Сборка без подписи — ставится через Sideloadly/AltStore.
  # Подпись живёт 7 дней, потом переустанавливаешь.
  ios-unsigned:
    name: iOS unsigned
    instance_type: mac_mini_m2
    max_build_duration: 120
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build
        # iOS 14+ не даёт запускать debug-сборки Flutter с домашнего экрана,
        # поэтому собираем release. --no-codesign — подпись добавит Sideloadly.
        # Версию берём из pubspec, чтобы проверка обновлений внутри
        # приложения считала правильный номер и не предлагала обновление
        # тому, кто уже на свежей сборке.
        script: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          echo "Собираем версию $V"
          flutter build ios --release --no-codesign --split-debug-info=build/symbols --dart-define=APP_VERSION=$V
      - name: Package IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry luxe.ipa Payload
          ls -la luxe.ipa
    artifacts:
      - build/ios/iphoneos/*.ipa

  # Сборка с подписью — нужен Apple Developer Account ($99/год).
  # Подключи: Codemagic → Team → App Store Connect → Automatic code signing
  ios-signed:
    name: iOS signed
    instance_type: mac_mini_m2
    max_build_duration: 120
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build and sign
        script: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          flutter build ipa --release --dart-define=APP_VERSION=$V
    artifacts:
      - build/ios/ipa/*.ipa