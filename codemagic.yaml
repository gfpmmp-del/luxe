name: luxe_ios
type: flutter

workflows:
  # Сборка без подписи — ставится через Sideloadly/AltStore.
  # Подпись живёт 7 дней, потом переустанавливаешь.
  ios-unsigned:
    name: iOS unsigned
    instance_type: mac_mini_m2
    max_build_duration: 120
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build
        # iOS 14+ не даёт запускать debug-сборки Flutter с домашнего экрана,
        # поэтому собираем release. --no-codesign — подпись добавит Sideloadly.
        script: flutter build ios --release --no-codesign --split-debug-info=build/symbols
      - name: Package IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry luxe.ipa Payload
          ls -la luxe.ipa
    artifacts:
      - build/ios/iphoneos/*.ipa

  # Сборка с подписью — нужен Apple Developer Account ($99/год).
  # Подключи: Codemagic → Team → App Store Connect → Automatic code signing
  ios-signed:
    name: iOS signed
    instance_type: mac_mini_m2
    max_build_duration: 120
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build and sign
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa